ShortDescription: "A free music studio: step sequencer, piano roll, mixer and real recorded instruments."
Description: |-
  Beatloom is a free music studio in the spirit of the classic pattern-based DAWs. Program beats
  in the step sequencer, write melodies in the piano roll, arrange patterns and audio in the
  playlist and mix everything with effects. It comes with synths and over a thousand recorded
  samples: grand piano, strings, brass, woodwinds and several drum kits. Works offline, supports
  MIDI keyboards, and exports WAV, MP3 and MIDI. The interface is available in English,
  Ukrainian and Russian.
